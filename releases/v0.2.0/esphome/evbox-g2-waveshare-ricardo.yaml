substitutions:
  device_name: evloadbalance-waveshare
  friendly_name: EV LoadBalance WaveShare
  grid_power_sensor_entity_id: sensor.your_grid_power_sensor
  energy_price_sensor_entity_id: sensor.your_current_electricity_tariff
  timezone: Europe/Amsterdam

time:
  - platform: homeassistant
    id: ha_time
    timezone: ${timezone}

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: Waveshare ESP32-S3-Relay-6CH EVBox G2 Chargepoint + Debug

  on_boot:
    priority: -100
    then:
      - delay: 2s

      - lambda: |-
          id(charging_status).publish_state("Booting CP init sequence");

          // Charging mode status herstellen op basis van global charging_mode
          if (id(charging_mode) == 0) {
            id(evbox_charging_mode_status).publish_state("Off");
          } else if (id(charging_mode) == 1) {
            id(evbox_charging_mode_status).publish_state("Manual");
          } else if (id(charging_mode) == 2) {
            id(evbox_charging_mode_status).publish_state("Auto");
          } else if (id(charging_mode) == 3) {
            id(evbox_charging_mode_status).publish_state("Solar Surplus");
          } else {
            id(evbox_charging_mode_status).publish_state("Unknown");
          }

          // Diagnose/defaults direct zichtbaar maken na reboot/flash
          id(evbox_debug).publish_state("Booting - waiting for EVBox communication");
          id(evbox_detected_generation).publish_state("Unknown");
          id(evbox_config_raw).publish_state("Waiting for command 33 response");
          id(evbox_meter_type).publish_state("Unknown");
          id(evbox_auto_start_config).publish_state("Unknown");
          id(evbox_remote_start_config).publish_state("Unknown");
          id(evbox_config_profile).publish_state("Unknown");
          id(evbox_current_rfid).publish_state("None");
          id(evbox_session_rfid).publish_state("None");

          if (id(last_rfid_id).empty()) {
            id(evbox_last_rfid).publish_state("None");
          } else {
            id(evbox_last_rfid).publish_state(id(last_rfid_id));
          }

          id(evbox_communication_ok).publish_state(false);
          id(evbox_is_charging).publish_state(false);
          id(evbox_locked).publish_state(false);
          id(evbox_session_active).publish_state(false);

      # 1. CP vraagt ChargeBox om opnieuw te registreren
      - lambda: |-
          auto send_frame = [&](std::string dst, std::string src, std::string cmd, std::string data) {
            std::string payload = dst + src + cmd + data;

            uint8_t checksum = 0;
            uint8_t parity = 0;
            for (char c : payload) {
              checksum = (checksum + (uint8_t)c) & 0xFF;
              parity ^= (uint8_t)c;
            }

            char cs[3];
            char pr[3];
            snprintf(cs, sizeof(cs), "%02X", checksum);
            snprintf(pr, sizeof(pr), "%02X", parity);

            std::vector<uint8_t> frame;
            frame.push_back(0x02);
            frame.insert(frame.end(), payload.begin(), payload.end());
            frame.push_back(cs[0]);
            frame.push_back(cs[1]);
            frame.push_back(pr[0]);
            frame.push_back(pr[1]);
            frame.push_back(0x03);
            frame.push_back(0xFF);

            id(uart_evbox).write_array(frame.data(), frame.size());
            ESP_LOGD("evbox", "TX payload: %s", payload.c_str());
          };

          send_frame("BC", "80", "1E", "");
          send_frame("01", "80", "1E", "");
          id(evbox_debug).publish_state("Boot: sent restart registration 1E broadcast and direct");

      - delay: 2s

      # 2. CP/backend connected / connection state changed
      - lambda: |-
          auto send_frame = [&](std::string dst, std::string src, std::string cmd, std::string data) {
            std::string payload = dst + src + cmd + data;

            uint8_t checksum = 0;
            uint8_t parity = 0;
            for (char c : payload) {
              checksum = (checksum + (uint8_t)c) & 0xFF;
              parity ^= (uint8_t)c;
            }

            char cs[3];
            char pr[3];
            snprintf(cs, sizeof(cs), "%02X", checksum);
            snprintf(pr, sizeof(pr), "%02X", parity);

            std::vector<uint8_t> frame;
            frame.push_back(0x02);
            frame.insert(frame.end(), payload.begin(), payload.end());
            frame.push_back(cs[0]);
            frame.push_back(cs[1]);
            frame.push_back(pr[0]);
            frame.push_back(pr[1]);
            frame.push_back(0x03);
            frame.push_back(0xFF);

            id(uart_evbox).write_array(frame.data(), frame.size());
            ESP_LOGD("evbox", "TX payload: %s", payload.c_str());
          };

          send_frame("BC", "80", "1B", "");
          id(evbox_debug).publish_state("Boot: sent connection state 1B broadcast");

      - delay: 500ms

      # 3. Ook direct naar huidig bekende adres proberen
      - lambda: |-
          auto send_frame = [&](std::string dst, std::string src, std::string cmd, std::string data) {
            std::string payload = dst + src + cmd + data;

            uint8_t checksum = 0;
            uint8_t parity = 0;
            for (char c : payload) {
              checksum = (checksum + (uint8_t)c) & 0xFF;
              parity ^= (uint8_t)c;
            }

            char cs[3];
            char pr[3];
            snprintf(cs, sizeof(cs), "%02X", checksum);
            snprintf(pr, sizeof(pr), "%02X", parity);

            std::vector<uint8_t> frame;
            frame.push_back(0x02);
            frame.insert(frame.end(), payload.begin(), payload.end());
            frame.push_back(cs[0]);
            frame.push_back(cs[1]);
            frame.push_back(pr[0]);
            frame.push_back(pr[1]);
            frame.push_back(0x03);
            frame.push_back(0xFF);

            id(uart_evbox).write_array(frame.data(), frame.size());
            ESP_LOGD("evbox", "TX payload: %s", payload.c_str());
          };

          send_frame(id(cb_address), "80", "1B", "");
          id(evbox_debug).publish_state("Boot: sent connection state 1B direct");

      - delay: 500ms

      # 4. LED-ring aan
      - lambda: |-
          auto send_frame = [&](std::string dst, std::string src, std::string cmd, std::string data) {
            std::string payload = dst + src + cmd + data;

            uint8_t checksum = 0;
            uint8_t parity = 0;
            for (char c : payload) {
              checksum = (checksum + (uint8_t)c) & 0xFF;
              parity ^= (uint8_t)c;
            }

            char cs[3];
            char pr[3];
            snprintf(cs, sizeof(cs), "%02X", checksum);
            snprintf(pr, sizeof(pr), "%02X", parity);

            std::vector<uint8_t> frame;
            frame.push_back(0x02);
            frame.insert(frame.end(), payload.begin(), payload.end());
            frame.push_back(cs[0]);
            frame.push_back(cs[1]);
            frame.push_back(pr[0]);
            frame.push_back(pr[1]);
            frame.push_back(0x03);
            frame.push_back(0xFF);

            id(uart_evbox).write_array(frame.data(), frame.size());
            ESP_LOGD("evbox", "TX payload: %s", payload.c_str());
          };

          send_frame("BC", "80", "1C", "01");
          id(evbox_debug).publish_state("Boot: sent LED enable 1C");

      - delay: 500ms

      # 5. State update opvragen
      - lambda: |-
          auto send_frame = [&](std::string dst, std::string src, std::string cmd, std::string data) {
            std::string payload = dst + src + cmd + data;

            uint8_t checksum = 0;
            uint8_t parity = 0;
            for (char c : payload) {
              checksum = (checksum + (uint8_t)c) & 0xFF;
              parity ^= (uint8_t)c;
            }

            char cs[3];
            char pr[3];
            snprintf(cs, sizeof(cs), "%02X", checksum);
            snprintf(pr, sizeof(pr), "%02X", parity);

            std::vector<uint8_t> frame;
            frame.push_back(0x02);
            frame.insert(frame.end(), payload.begin(), payload.end());
            frame.push_back(cs[0]);
            frame.push_back(cs[1]);
            frame.push_back(pr[0]);
            frame.push_back(pr[1]);
            frame.push_back(0x03);
            frame.push_back(0xFF);

            id(uart_evbox).write_array(frame.data(), frame.size());
            ESP_LOGD("evbox", "TX payload: %s", payload.c_str());
          };

          send_frame(id(cb_address), "80", "18", "02");
          id(evbox_debug).publish_state("Boot: requested state update 18 02");

      - delay: 5s

      # Late recovery-init na OTA/flash/restart.
      # Nodig omdat de ChargeBox zelf niet reboot wanneer de ESP opnieuw start.
      - lambda: |-
          auto send_frame = [&](std::string dst, std::string src, std::string cmd, std::string data) {
            std::string payload = dst + src + cmd + data;

            uint8_t checksum = 0;
            uint8_t parity = 0;
            for (char c : payload) {
              checksum = (checksum + (uint8_t)c) & 0xFF;
              parity ^= (uint8_t)c;
            }

            char cs[3];
            char pr[3];
            snprintf(cs, sizeof(cs), "%02X", checksum);
            snprintf(pr, sizeof(pr), "%02X", parity);

            std::vector<uint8_t> frame;
            frame.push_back(0x02);
            frame.insert(frame.end(), payload.begin(), payload.end());
            frame.push_back(cs[0]);
            frame.push_back(cs[1]);
            frame.push_back(pr[0]);
            frame.push_back(pr[1]);
            frame.push_back(0x03);
            frame.push_back(0xFF);

            id(uart_evbox).write_array(frame.data(), frame.size());
            ESP_LOGD("evbox", "TX payload: %s", payload.c_str());
          };

          send_frame("BC", "80", "1E", "");
          send_frame(id(cb_address), "80", "1E", "");
          id(evbox_debug).publish_state("Late boot: restart registration 1E broadcast and direct");

      - delay: 1s

      - lambda: |-
          auto send_frame = [&](std::string dst, std::string src, std::string cmd, std::string data) {
            std::string payload = dst + src + cmd + data;

            uint8_t checksum = 0;
            uint8_t parity = 0;
            for (char c : payload) {
              checksum = (checksum + (uint8_t)c) & 0xFF;
              parity ^= (uint8_t)c;
            }

            char cs[3];
            char pr[3];
            snprintf(cs, sizeof(cs), "%02X", checksum);
            snprintf(pr, sizeof(pr), "%02X", parity);

            std::vector<uint8_t> frame;
            frame.push_back(0x02);
            frame.insert(frame.end(), payload.begin(), payload.end());
            frame.push_back(cs[0]);
            frame.push_back(cs[1]);
            frame.push_back(pr[0]);
            frame.push_back(pr[1]);
            frame.push_back(0x03);
            frame.push_back(0xFF);

            id(uart_evbox).write_array(frame.data(), frame.size());
            ESP_LOGD("evbox", "TX payload: %s", payload.c_str());
          };

          send_frame("BC", "80", "1B", "");
          send_frame(id(cb_address), "80", "1B", "");
          id(evbox_debug).publish_state("Late boot: connection state 1B broadcast and direct");

      - delay: 1s

      - lambda: |-
          auto send_frame = [&](std::string dst, std::string src, std::string cmd, std::string data) {
            std::string payload = dst + src + cmd + data;

            uint8_t checksum = 0;
            uint8_t parity = 0;
            for (char c : payload) {
              checksum = (checksum + (uint8_t)c) & 0xFF;
              parity ^= (uint8_t)c;
            }

            char cs[3];
            char pr[3];
            snprintf(cs, sizeof(cs), "%02X", checksum);
            snprintf(pr, sizeof(pr), "%02X", parity);

            std::vector<uint8_t> frame;
            frame.push_back(0x02);
            frame.insert(frame.end(), payload.begin(), payload.end());
            frame.push_back(cs[0]);
            frame.push_back(cs[1]);
            frame.push_back(pr[0]);
            frame.push_back(pr[1]);
            frame.push_back(0x03);
            frame.push_back(0xFF);

            id(uart_evbox).write_array(frame.data(), frame.size());
            ESP_LOGD("evbox", "TX payload: %s", payload.c_str());
          };

          send_frame(id(cb_address), "80", "18", "02");
          //id(delayed_get_configuration).execute();
          id(evbox_debug).publish_state("Late boot: requested state update and scheduled configuration");

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2

  ap:
    ssid: "${friendly_name} Fallback"
    password: "evloadbalance"

captive_portal:

globals:
  - id: cb_address
    type: std::string
    restore_value: no
    initial_value: '"01"'

  - id: start_sent
    type: bool
    restore_value: no
    initial_value: 'false'

  # 0 = Off, 1 = Errors only, 2 = Important, 3 = Verbose
  - id: debug_mode
    type: int
    restore_value: yes
    initial_value: '2'

  # 0 seconden = alles publiceren naar Home Assistant
  - id: debug_interval_seconds
    type: int
    restore_value: yes
    initial_value: '30'

  - id: last_debug_publish_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: detected_generation
    type: std::string
    restore_value: no
    initial_value: '"Unknown"'

  - id: last_meter_kwh
    type: float
    restore_value: no
    initial_value: '0.0'

  - id: last_meter_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: has_last_meter
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: last_valid_rx_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: charging_mode
    type: int
    restore_value: yes
    initial_value: '1'

  - id: last_sent_current_tenths
    type: int
    restore_value: no
    initial_value: '0'

  - id: session_active
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: session_start_meter_kwh
    type: float
    restore_value: no
    initial_value: '0.0'

  - id: session_energy_kwh
    type: float
    restore_value: no
    initial_value: '0.0'

  - id: session_solar_surplus_energy_kwh
    type: float
    restore_value: no
    initial_value: '0.0'

  - id: session_grid_energy_kwh
    type: float
    restore_value: no
    initial_value: '0.0'

  - id: session_last_update_ms
