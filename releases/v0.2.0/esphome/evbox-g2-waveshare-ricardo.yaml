# ==================== BUTTONS ====================
button:
  - platform: restart
    name: "EVBox Autostart Restart"
    entity_category: diagnostic

  - platform: safe_mode
    name: "EVBox Autostart Safe Mode Boot"
    entity_category: diagnostic

  - platform: template
    name: "EVBox Start Charging"
    on_press:
      - lambda: |-
          auto send_frame = [&](std::string dst, std::string src, std::string cmd, std::string data) {
            std::string payload = dst + src + cmd + data;

            uint8_t checksum = 0;
            uint8_t parity = 0;
            for (char c : payload) {
              checksum = (checksum + (uint8_t)c) & 0xFF;
              parity ^= (uint8_t)c;
            }

            char cs[3];
            char pr[3];
            snprintf(cs, sizeof(cs), "%02X", checksum);
            snprintf(pr, sizeof(pr), "%02X", parity);

            std::vector<uint8_t> frame;
            frame.push_back(0x02);
            frame.insert(frame.end(), payload.begin(), payload.end());
            frame.push_back(cs[0]);
            frame.push_back(cs[1]);
            frame.push_back(pr[0]);
            frame.push_back(pr[1]);
            frame.push_back(0x03);
            frame.push_back(0xFF);

            id(uart_evbox).write_array(frame.data(), frame.size());
            ESP_LOGD("evbox", "TX payload: %s", payload.c_str());
          };

          if (id(charging_mode) == 0) {
            id(charging_status).publish_state("Start blocked - charging mode Off");
            id(evbox_debug).publish_state("Start blocked because charging mode is Off");
            return;
          }

          id(manual_start_requested) = true;
          id(start_sent) = false;
          id(last_sent_current_tenths) = 0;
          id(solar_import_over_limit_since_ms) = 0;
          id(solar_stopped_by_surplus_control) = false;

          send_frame(id(cb_address), "80", "31", "08000000AS00000000000000");
          id(charging_status).publish_state("Start charging requested");
          id(evbox_debug).publish_state("Start charging requested via command 31");

  - platform: template
    name: "EVBox Stop Charging"
    on_press:
      - lambda: |-
          auto send_frame = [&](std::string dst, std::string src, std::string cmd, std::string data) {
            std::string payload = dst + src + cmd + data;

            uint8_t checksum = 0;
            uint8_t parity = 0;
            for (char c : payload) {
              checksum = (checksum + (uint8_t)c) & 0xFF;
              parity ^= (uint8_t)c;
            }

            char cs[3];
            char pr[3];
            snprintf(cs, sizeof(cs), "%02X", checksum);
            snprintf(pr, sizeof(pr), "%02X", parity);

            std::vector<uint8_t> frame;
            frame.push_back(0x02);
            frame.insert(frame.end(), payload.begin(), payload.end());
            frame.push_back(cs[0]);
            frame.push_back(cs[1]);
            frame.push_back(pr[0]);
            frame.push_back(pr[1]);
            frame.push_back(0x03);
            frame.push_back(0xFF);

            id(uart_evbox).write_array(frame.data(), frame.size());
            ESP_LOGD("evbox", "TX payload: %s", payload.c_str());
          };

          send_frame(id(cb_address), "80", "32", "00000000");
          id(charging_status).publish_state("Stop charging requested");
          id(evbox_debug).publish_state("Stop charging requested via command 32");
